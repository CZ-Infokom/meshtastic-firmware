[env:seeed_solar_node]
custom_meshtastic_hw_model = 95
custom_meshtastic_hw_model_slug = SEEED_SOLAR_NODE
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed SenseCAP Solar Node
custom_meshtastic_images = seeed_solar.svg
custom_meshtastic_tags = Seeed

board = seeed_solar_node
extends = nrf52840_base
;board_level = extra
build_flags = ${nrf52840_base.build_flags} 
  -I variants/nrf52840/seeed_solar_node 
  -D SEEED_SOLAR_NODE 
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_solar_node>
debug_tool = jlink

; DYP-A01 on GNSS UART (D6/D7); GNSS disabled. Sensor VCC on switched GNSS 3V3 (D18).
[env:seeed_solar_node_dyp_nogps]
extends = env:seeed_solar_node
build_flags = ${env:seeed_solar_node.build_flags}
  -D DYP_A01_USE_SERIAL1=1

; UART auto-output DYP-A01 SKU (ANYUB etc.): passive read, Yellow wire optional.
[env:seeed_solar_node_dyp_uart_auto]
extends = env:seeed_solar_node
build_flags = ${env:seeed_solar_node.build_flags}
  -D DYP_A01_UART_CONTROLLED=0

[env:seeed_solar_node_dyp_nogps_uart_auto]
extends = env:seeed_solar_node_dyp_nogps
build_flags = ${env:seeed_solar_node_dyp_nogps.build_flags}
  -D DYP_A01_UART_CONTROLLED=0
